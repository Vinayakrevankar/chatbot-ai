[project]
name = "cx"
version = "0.1.0"
description = "Local RAG assistant over the Skillz support knowledge base"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "requests>=2.31",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
cx = "cx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cx"]
